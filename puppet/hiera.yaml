---
version: 5
defaults:
  datadir: data
  data_hash: yaml_data
hierarchy:
  - name: External IPAM snapshot (only profile::policy::ipam)
    path: external/ipam.json
    data_hash: json_data
  - name: Application contracts and access policy
    path: policy.yaml
  - name: Logical address groups
    path: groups.yaml
  - name: Shared VM inventory (also read by Terraform)
    path: inventory.yaml
  - name: Lookup behavior
    path: common.yaml
